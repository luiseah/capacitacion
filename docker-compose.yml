x-app-base: &app_base
  build:
    context: .
    dockerfile: .docker/php/Dockerfile
    args:
      user: user_server
      uid: 1000
      NODE_MAJOR: 22
  restart: unless-stopped
  tty: true
  volumes:
    - .:/var/www
    - .docker/php/config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
  networks:
    - network

services:
  backend:
    <<: *app_base
    depends_on:
      - cache

  queues:
    <<: *app_base
    command: [ "php", "artisan", "horizon" ]
    depends_on:
      - cache

  cron:
    <<: *app_base
    command: [ "sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done" ]
    depends_on:
      - backend

  webserver:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - .docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .docker/nginx/frontend.conf:/etc/nginx/conf.d/frontend.conf
    depends_on:
      - backend
    networks:
      - network

  smtpServer:
    image: axllent/mailpit:latest
    restart: unless-stopped
    profiles:
      - local
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - network

  frontend:
    image: node:current-alpine
    restart: unless-stopped
    working_dir: /var/www
    profiles:
      - local
    volumes:
      - .:/var/www
    networks:
      - network
    command: >
      sh -c "npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
      image: postgres:16.13-alpine
      restart: unless-stopped
      profiles:
        - local
      environment:
        POSTGRES_DB: postgresql
        POSTGRES_USER: user_db
        POSTGRES_PASSWORD: secret
      volumes:
        - db_data_pgsql:/var/lib/postgresql
        - .docker/db/schemas/pgsql/:/schemas/
        - .docker/db/pgsql/docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d
      ports:
        - 5432:5432
      networks:
        - network

  cache:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    restart: unless-stopped
    networks:
      - network

volumes:
  db_data_pgsql:

networks:
  network:
    driver: bridge
