; PHP security hardening defaults for container runtime.

; Hide the PHP version/signature from HTTP responses.
expose_php = Off

; Prevent remote/local file inclusion through URL wrappers.
allow_url_include = Off

; Do not show errors to end users (avoid leaking internals).
display_errors = Off

; Keep error logging enabled for diagnostics and incident response.
log_errors = On

; Disable legacy PATH_INFO behavior to reduce file execution ambiguity.
cgi.fix_pathinfo = 0

; Reject uninitialized session IDs to mitigate session fixation.
session.use_strict_mode = 1

; Block JavaScript access to session cookies.
session.cookie_httponly = 1

; Limit cross-site cookie sending while keeping common navigation flows.
session.cookie_samesite = Lax

; Hide function arguments in stack traces to reduce sensitive data exposure.
zend.exception_ignore_args = On
